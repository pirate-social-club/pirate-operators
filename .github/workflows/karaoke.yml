name: Karaoke client
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/karaoke/**"
      - "packages/protocol/**"
      - "packages/scoring/**"
      - "services/karaoke*.ts"
      - "services/runtime.ts"
      - "services/community*.ts"
      - "services/records.ts"
      - "services/storage.ts"
      - "services/service-call.ts"
      - "packages/alignment/**"
      - "packages/community/**"
      - "packages/records/**"
      - "apps/community-wizard/infra/migrations/**"
      - "fixtures/first-song/**"
      - "harness/karaoke-*.ts"
      - "harness/runtime.ts"
      - "harness/chain.ts"
      - "test/karaoke-*.ts"
      - "test/song-alignment-*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/karaoke.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/karaoke/**"
      - "packages/protocol/**"
      - "packages/scoring/**"
      - "services/karaoke*.ts"
      - "services/runtime.ts"
      - "services/community*.ts"
      - "services/records.ts"
      - "services/storage.ts"
      - "services/service-call.ts"
      - "packages/alignment/**"
      - "packages/community/**"
      - "packages/records/**"
      - "apps/community-wizard/infra/migrations/**"
      - "fixtures/first-song/**"
      - "harness/karaoke-*.ts"
      - "harness/runtime.ts"
      - "harness/chain.ts"
      - "test/karaoke-*.ts"
      - "test/song-alignment-*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/karaoke.yml"
# PR updates replace obsolete verification; accepted main runs retain evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  karaoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      # anvil runs the disposable local chain that publication pays on.
      - uses: foundry-rs/foundry-toolchain@v1
        id: foundry
        continue-on-error: true
        with:
          version: v1.9.0
      - name: Retry pinned Foundry installation
        if: steps.foundry.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: Install root and web dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web
      # Local acceptance owns test/karaoke-* and test/song-alignment-*;
      # Web client owns apps/web/test/karaoke-*. Keep those gates at release.
      - name: Typecheck the web client
        working-directory: apps/web
        run: npm run typecheck
      - name: Build the Karaoke screen and the live community page
        working-directory: apps/web
        run: |
          node_modules/.bin/vite build --config vite.karaoke.config.ts
          node_modules/.bin/vite build --config vite.live.config.ts
      - name: Install matching Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Karaoke playback, live capture and published-song browser journeys, external networking unavailable
        working-directory: apps/web
        run: |
          sudo --preserve-env=PATH,HOME unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            node_modules/.bin/playwright test --config playwright.karaoke.config.ts
            node_modules/.bin/playwright test --config playwright.learning.config.ts
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karaoke-browser-results
          path: |
            .local/karaoke-browser-results/
            .local/learning-browser-results/
          include-hidden-files: true

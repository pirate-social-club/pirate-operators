name: Web client
on:
  push:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "services/**"
      - "harness/**"
      - "fixtures/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "services/**"
      - "harness/**"
      - "fixtures/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install shared package and web dependencies
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:components
      - run: npm run build
      - run: npm run build:live
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:live
      - name: Wallet identity and Send recovery browser regressions
        run: npm run test:e2e:wallet
      - name: Reproduce the release from two clean builds
        run: node scripts/reproducible.ts "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-release
          path: |
            apps/web/dist/car/car.json
            apps/web/dist/budget.json
            apps/web/dist/site/app/release.json

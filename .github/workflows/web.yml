name: Web client
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "services/**"
      - "harness/**"
      - "fixtures/**"
      - "test/karaoke-expect.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "services/**"
      - "harness/**"
      - "fixtures/**"
      - "test/karaoke-expect.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
# PR updates replace obsolete verification; accepted main runs retain evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install shared package and web dependencies
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:components
      - run: npm run build
      - run: npm run build:live
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:live
      - name: Wallet identity and Send recovery browser regressions
        run: npm run test:e2e:wallet
      - name: Profile, player and browser storage regressions
        run: npm run test:e2e:owner-ui
      - name: Reproduce the release from two clean builds
        run: |
          set -euo pipefail
          mkdir -p ../../.local
          node scripts/reproducible.ts "$GITHUB_SHA" | tee ../../.local/web-reproducibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-release
          path: |
            apps/web/dist/car/car.json
            apps/web/dist/budget.json
            apps/web/dist/site/app/release.json
            .local/web-reproducibility.json
          include-hidden-files: true
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

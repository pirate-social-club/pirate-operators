name: VM runner probe
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 8
    steps:
      - name: Probe nested virtualization and disk
        run: |
          set -euxo pipefail
          uname -a
          nproc
          free -h
          df -h /
          ls -l /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage p7zip-full
          fi
          qemu-system-x86_64 --version
          qemu-img --version
          docker version

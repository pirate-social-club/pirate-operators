name: Community wizard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/community-wizard/**"
      - "packages/**"
      - "services/**"
      - "harness/**"
      - "fixtures/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/community-wizard.yml"
  pull_request:
    paths:
      - "apps/community-wizard/**"
      - "packages/**"
      - "services/**"
      - "harness/**"
      - "fixtures/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/community-wizard.yml"
# PR updates replace obsolete verification; accepted main runs retain evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  wizard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/community-wizard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/community-wizard/package-lock.json
      - name: Install shared package and wizard dependencies
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/community-wizard
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:browser
      - name: Install production dependencies only
        working-directory: .
        run: |
          npm ci --omit=dev --ignore-scripts
          npm ci --omit=dev --ignore-scripts --prefix apps/community-wizard
      - run: npm run smoke:runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-wizard-browser
          path: apps/community-wizard/test-results

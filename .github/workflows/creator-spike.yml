name: Creator wallet spike
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/creator-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/creator-spike/package-lock.json
      - name: Install shared server dependencies
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm run check

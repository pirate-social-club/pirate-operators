name: Creator wallet spike
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/creator-spike/**
      - packages/community/**
      - package.json
      - package-lock.json
      - .github/workflows/creator-spike.yml
  push:
    branches: [main]
    paths:
      - apps/creator-spike/**
      - packages/community/**
      - package.json
      - package-lock.json
      - .github/workflows/creator-spike.yml
# PR updates replace obsolete verification; accepted main runs retain evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/creator-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/creator-spike/package-lock.json
      - name: Install shared server dependencies
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm run check

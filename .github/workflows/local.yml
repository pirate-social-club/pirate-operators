name: Local acceptance
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-tests:
    name: Root integration tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/community-wizard/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        id: foundry
        continue-on-error: true
        with:
          version: v1.9.0
      - name: Retry pinned Foundry installation
        if: steps.foundry.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: Bootstrap dependencies and Solidity compiler
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web
          npm ci --ignore-scripts --prefix apps/community-wizard
          forge build
      - name: Install media test tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install pinned Caddy for real HTTPS ingress tests
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/pirate-caddy-2.11.9"
          mkdir -m 700 "$tool"
          base=https://github.com/caddyserver/caddy/releases/download/v2.11.9
          curl --fail --location --retry 2 --max-time 90 "$base/caddy_2.11.9_checksums.txt" -o "$tool/checksums.txt"
          curl --fail --location --retry 2 --max-time 90 "$base/caddy_2.11.9_linux_amd64.tar.gz" -o "$tool/caddy_2.11.9_linux_amd64.tar.gz"
          cd "$tool"
          echo 'e4e1e43b78299733b19b8aeab8abebcf57aef4f5dae617be125016f9e4e0299f  checksums.txt' | sha256sum -c -
          echo '5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb  caddy_2.11.9_linux_amd64.tar.gz' | sha256sum -c -
          # Upstream uses SHA512; GitHub asset SHA256 is pinned above as well.
          grep '  caddy_2.11.9_linux_amd64.tar.gz$' checksums.txt | sha512sum -c -
          tar --extract --gzip --file caddy_2.11.9_linux_amd64.tar.gz --no-same-owner caddy LICENSE README.md
          echo 'a563843e11cbce39c557bd429ebb787d56f49d51d9bbb3292cd9b36b37a60cdf  caddy' | sha256sum -c -
          chmod 555 caddy
          printf 'PIRATE_CADDY_BINARY=%s/caddy\n' "$tool" >> "$GITHUB_ENV"
          echo 'PIRATE_CADDY_SHA256=a563843e11cbce39c557bd429ebb787d56f49d51d9bbb3292cd9b36b37a60cdf' >> "$GITHUB_ENV"
      - name: Run assigned root integration shard without external networking
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          mkdir -p .local
          sudo --preserve-env=PATH,HOME,TEST_SHARD,PIRATE_CADDY_BINARY,PIRATE_CADDY_SHA256 unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            # Native filesystem tests need fresh private scratch, including /run.
            TMPDIR="$(mktemp -d)"
            PIRATE_TEST_RUN_PARENT="$(mktemp -d /run/pirate-root-tests.XXXXXXXX)"
            export TMPDIR PIRATE_TEST_RUN_PARENT
            node harness/ci/run-root-tests.mjs
            test -s ".local/root-tests-${TEST_SHARD%/*}.xml"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-tests-${{ matrix.shard }}
          path: |
            .local/root-tests-${{ matrix.shard }}.xml
            .local/root-test-plan-${{ matrix.shard }}.json
            .local/compiler-artifact-contract.json
          include-hidden-files: true
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

  offline-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/community-wizard/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        id: foundry
        continue-on-error: true
        with:
          version: v1.9.0
      - name: Retry pinned Foundry installation
        if: steps.foundry.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: Bootstrap dependencies and Solidity compiler
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web
          npm ci --ignore-scripts --prefix apps/community-wizard
          forge build
      - name: Validate Worker packaging
        run: npm run build
      - name: Install media test tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Type, Solidity and repeatable acceptance without external networking
        run: |
          mkdir -p .local
          sudo --preserve-env=PATH,HOME unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            npm run typecheck
            forge test --offline
            node harness/acceptance.ts > .local/trace-first.jsonl
            node harness/acceptance.ts > .local/trace-second.jsonl
            cmp .local/trace-first.jsonl .local/trace-second.jsonl
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-traces
          path: |
            .local/trace-first.jsonl
            .local/trace-second.jsonl
          include-hidden-files: true
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

  local:
    if: always()
    needs: [root-tests, offline-acceptance]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every root shard and offline acceptance
        env:
          ROOT_TESTS_RESULT: ${{ needs.root-tests.result }}
          ACCEPTANCE_RESULT: ${{ needs.offline-acceptance.result }}
        run: |
          test "$ROOT_TESTS_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success

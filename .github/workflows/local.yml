name: Local acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        id: foundry
        continue-on-error: true
        with:
          version: v1.9.0
      - name: Retry pinned Foundry installation
        if: steps.foundry.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: Bootstrap dependencies and Solidity compiler
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web
          forge build
      - name: Validate Worker packaging
        run: npm run build
      - name: Install media test tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Run with external networking unavailable
        run: |
          sudo --preserve-env=PATH,HOME unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            npm run check
            node harness/acceptance.ts > .local/trace-first.jsonl
            node harness/acceptance.ts > .local/trace-second.jsonl
            cmp .local/trace-first.jsonl .local/trace-second.jsonl
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-traces
          path: .local/trace-*.jsonl
